<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F6F7F9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MAKO" />
    <meta name="description" content="La gestión de tu edificio, simplificada." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Ícono SVG para browsers -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" />
    <title>MAKO</title>
    <style>
      html, body { margin:0; padding:0; background:#F6F7F9; height:100%; overflow:hidden; }
      body.dark-mode, body.dark-mode #root { background:#0A1428; }
      #root {
        max-width: 430px; margin: 0 auto; height: 100%;
        display: flex; flex-direction: column;
        background: #F6F7F9; position: relative;
      }
    </style>
    <script>
      // Tema claro por defecto: se aplica antes de pintar para evitar parpadeos
      try {
        var dark = localStorage.getItem('fixhub_darkmode') === 'true';
        document.addEventListener('DOMContentLoaded', function(){});
        window.__dark = dark;
      } catch (e) { window.__dark = false; }
    </script>
  </head>
  <body>
    <script>
      document.body.classList.add(window.__dark ? 'dark-mode' : 'light-mode');
      var m = document.querySelector('meta[name=theme-color]'); if (m && window.__dark) m.content = '#0A1428';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
